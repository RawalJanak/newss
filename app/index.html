<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131417" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyNews">
<title>MyNews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FBFAF8; --surface:#FFFFFF; --sunken:#F2EFEA;
    --ink:#16181C; --muted:#585F68; --faint:#8B929B;
    --line:#E7E2DA; --line-soft:#F0ECE5;
    --accent:#2F5D50; --accent-ink:#FFFFFF;
    --ok:#2E6B4F; --warn:#8A6520; --plain:#5C646F;
    --lift:0 1px 1px rgba(22,24,28,.03), 0 8px 24px -12px rgba(22,24,28,.14);
    --lift-hi:0 2px 4px rgba(22,24,28,.05), 0 16px 40px -16px rgba(22,24,28,.2);
    --serif:'Newsreader', Georgia, 'Times New Roman', serif;
    --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --w:680px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#131417; --surface:#191B1F; --sunken:#202329;
      --ink:#E9E9EC; --muted:#A2A7AE; --faint:#767C85;
      --line:#272B31; --line-soft:#1F2228;
      --accent:#84B5A5; --accent-ink:#131417;
      --ok:#7FB99B; --warn:#C9A25C; --plain:#8B939E;
      --lift:0 1px 1px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --lift-hi:0 2px 4px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg:#131417; --surface:#191B1F; --sunken:#202329;
    --ink:#E9E9EC; --muted:#A2A7AE; --faint:#767C85;
    --line:#272B31; --line-soft:#1F2228;
    --accent:#84B5A5; --accent-ink:#131417;
    --ok:#7FB99B; --warn:#C9A25C; --plain:#8B939E;
    --lift:0 1px 1px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --lift-hi:0 2px 4px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.6);
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
    min-height:100vh; overflow-x:hidden;
  }
  button { font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
  a { color:inherit; }
  img { display:block; max-width:100%; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }

  /* ---------- masthead ---------- */
  header { background:var(--bg); padding-top:env(safe-area-inset-top); }
  .top {
    max-width:var(--w); margin:0 auto; padding:20px 20px 0;
    display:flex; align-items:baseline; gap:14px;
  }
  .brand {
    font-family:var(--serif); font-size:28px; font-weight:600; letter-spacing:-.02em;
    line-height:1; flex:1;
  }
  .datestamp {
    max-width:var(--w); margin:0 auto; padding:7px 20px 16px;
    font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
  }
  .iconbtn {
    width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
    font-size:15px; color:var(--muted); transition:background .18s var(--ease);
  }
  .iconbtn:hover { background:var(--sunken); }

  /* ---------- region segmented ---------- */
  .segwrap { max-width:var(--w); margin:0 auto; padding:0 20px 14px; }
  .seg {
    display:grid; grid-template-columns:repeat(3,1fr); gap:2px;
    background:var(--sunken); border-radius:11px; padding:3px;
  }
  .seg button {
    padding:9px 4px; border-radius:8px; font-size:13.5px; font-weight:600;
    color:var(--muted); letter-spacing:.01em;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:var(--lift); }

  /* ---------- category chips ---------- */
  .chips {
    max-width:var(--w); margin:0 auto; padding:0 20px 18px;
    display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
  }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:none; padding:6px 13px; border-radius:999px; font-size:13px; white-space:nowrap;
    color:var(--muted); border:1px solid var(--line);
    transition:border-color .18s var(--ease), color .18s var(--ease);
  }
  .chip.on { color:var(--ink); border-color:var(--ink); font-weight:600; }

  .rule { max-width:var(--w); margin:0 auto; padding:0 20px; }
  .rule hr { border:none; border-top:1px solid var(--line); margin:0; }

  /* ---------- view switch ---------- */
  .views { max-width:var(--w); margin:0 auto; padding:0 20px 14px; display:flex; gap:24px; }
  .views button {
    padding:0 0 10px; font-size:15px; font-weight:600; color:var(--faint);
    border-bottom:2px solid transparent; transition:color .18s var(--ease), border-color .18s var(--ease);
  }
  .views button.on { color:var(--ink); border-bottom-color:var(--accent); }

  /* ---------- markets ---------- */
  .asof {
    max-width:var(--w); margin:0 auto; padding:16px 20px 0;
    font-size:12px; color:var(--faint);
  }
  .idxstrip {
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:16px 0 24px;
  }
  .idx {
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:13px 14px; box-shadow:var(--lift);
  }
  .idx .nm {
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
    font-weight:700; margin-bottom:5px;
  }
  .idx .px { font-size:19px; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .idx .ch { font-size:13px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums; }
  .up { color:var(--ok); }
  .dn { color:#B4443C; }
  :root[data-theme="dark"] .dn { color:#E08078; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dn { color:#E08078; } }

  .read {
    background:var(--sunken); border-radius:14px; padding:20px; margin-bottom:26px;
  }
  .read h3 {
    font-family:var(--serif); font-size:20px; font-weight:600; margin:0 0 10px;
    letter-spacing:-.01em; line-height:1.25;
  }
  .read p { margin:0; font-size:15.5px; line-height:1.65; color:var(--muted); }
  .breadth {
    display:flex; align-items:center; gap:10px; margin-top:16px; font-size:12.5px;
    color:var(--faint); flex-wrap:wrap;
  }
  .bar { flex:1; min-width:120px; height:6px; border-radius:3px; background:var(--line); overflow:hidden; display:flex; }
  .bar span { display:block; height:100%; }
  .bar .g { background:var(--ok); }
  .bar .r { background:#B4443C; }

  .tbl { margin-bottom:28px; }
  .tbl h4 {
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--faint); margin:0 0 10px;
  }
  .row {
    display:flex; align-items:center; gap:12px; padding:11px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .row:last-child { border-bottom:none; }
  .row .tick { flex:1; min-width:0; }
  .row .sym { font-size:14.5px; font-weight:600; letter-spacing:-.01em; }
  .row .sub { font-size:12px; color:var(--faint); margin-top:1px; }
  .row .val { text-align:right; font-variant-numeric:tabular-nums; }
  .row .p { font-size:14.5px; font-weight:500; }
  .row .c { font-size:12.5px; font-weight:600; margin-top:1px; }
  .disclaim {
    font-size:12px; line-height:1.6; color:var(--faint); padding:16px 0 0;
    border-top:1px solid var(--line);
  }

  /* ---------- feed ---------- */
  main { max-width:var(--w); margin:0 auto; padding:26px 20px 90px; }
  .sect {
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--faint); margin:38px 0 18px;
  }
  .sect:first-child { margin-top:0; }

  .story {
    display:block; width:100%; text-align:left; padding:0 0 30px; margin-bottom:30px;
    border-bottom:1px solid var(--line-soft);
    opacity:0; transform:translateY(8px);
    animation:rise .42s var(--ease) forwards;
  }
  .story:last-child { border-bottom:none; }
  @keyframes rise { to { opacity:1; transform:none; } }

  .shot {
    width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:14px;
    background:var(--sunken); margin-bottom:16px; box-shadow:var(--lift);
    transition:box-shadow .3s var(--ease), transform .3s var(--ease);
  }
  .story:hover .shot { box-shadow:var(--lift-hi); transform:translateY(-2px); }
  .story.small .shot { aspect-ratio:2/1; border-radius:12px; }

  .eyebrow { display:flex; align-items:center; gap:9px; margin-bottom:9px; flex-wrap:wrap; }
  .cat {
    font-size:11px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
    color:var(--accent);
  }
  .badge {
    display:inline-flex; align-items:center; gap:5px;
    font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:5px; background:var(--sunken); color:var(--muted);
  }
  .badge i { width:5px; height:5px; border-radius:50%; background:currentColor; font-style:normal; }
  .badge.ok { color:var(--ok); }
  .badge.warn { color:var(--warn); }
  .badge.plain { color:var(--plain); }

  .story h2 {
    font-family:var(--serif); font-size:26px; line-height:1.22; font-weight:600;
    letter-spacing:-.015em; margin:0 0 10px; text-wrap:balance;
  }
  .story.small h2 { font-size:20px; line-height:1.28; }
  .story p {
    margin:0 0 12px; font-size:15.5px; line-height:1.62; color:var(--muted);
    max-width:60ch;
  }
  .meta { font-size:12.5px; color:var(--faint); }

  .empty { text-align:center; color:var(--faint); padding:70px 20px; }

  /* ---------- reader ---------- */
  .reader {
    position:fixed; inset:0; z-index:100; background:var(--bg);
    overflow-y:auto; -webkit-overflow-scrolling:touch; display:none;
  }
  .reader.open { display:block; animation:fade .26s var(--ease); }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .rbar {
    position:sticky; top:0; z-index:5; background:var(--bg);
    border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);
  }
  .rbar div { max-width:var(--w); margin:0 auto; padding:12px 20px; }
  .back { font-size:15px; color:var(--muted); display:inline-flex; gap:8px; align-items:center; }
  .art { max-width:var(--w); margin:0 auto; padding:0 20px 100px; }
  .art .lead {
    width:calc(100% + 40px); margin-left:-20px; aspect-ratio:16/9; object-fit:cover;
    background:var(--sunken);
  }
  .art h1 {
    font-family:var(--serif); font-size:clamp(28px,7vw,36px); line-height:1.15;
    font-weight:600; letter-spacing:-.02em; margin:20px 0 14px; text-wrap:balance;
  }
  .dek {
    font-family:var(--serif); font-size:19px; line-height:1.5; color:var(--muted);
    margin:0 0 20px;
  }
  .byline {
    display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:12.5px;
    color:var(--faint); padding:13px 0; border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .byline b { color:var(--ink); font-weight:600; }
  .verify {
    margin:22px 0; padding:16px 18px; background:var(--sunken); border-radius:12px;
  }
  .verify h4 {
    margin:0 0 10px; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--faint); font-weight:700;
  }
  .verify ul { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; }
  .verify li { font-size:14px; }
  .verify a { color:var(--accent); text-decoration:none; }
  .verify a:hover { text-decoration:underline; }
  .body { margin-top:24px; }
  .body p { font-size:17.5px; line-height:1.75; margin:0 0 22px; }
  .body h2 {
    font-family:var(--serif); font-size:22px; line-height:1.3; font-weight:600;
    margin:34px 0 14px; letter-spacing:-.01em;
  }
  .body b { font-weight:600; }
  .body ul { padding-left:20px; margin:0 0 22px; }
  .body li { font-size:17px; line-height:1.7; margin-bottom:8px; }
  .disc {
    margin:26px 0; padding:16px 18px; border:1px solid var(--line); border-radius:12px;
  }
  .disc h4 {
    margin:0 0 8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--faint); font-weight:700;
  }
  .disc a { color:inherit; text-decoration:none; font-size:15px; line-height:1.5; }
  .disc .st { margin-top:7px; font-size:12.5px; color:var(--faint); }
  .srcbtn {
    display:inline-block; margin-top:6px; padding:13px 22px; border-radius:10px;
    background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:14.5px;
    text-decoration:none; transition:opacity .18s var(--ease);
  }
  .srcbtn:hover { opacity:.86; }
  .note {
    margin-top:26px; font-size:12.5px; line-height:1.65; color:var(--faint);
    padding-top:18px; border-top:1px solid var(--line);
  }

  @media (min-width:720px) {
    .story h2 { font-size:29px; }
    .art .lead { width:100%; margin-left:0; border-radius:16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
    .story { opacity:1; transform:none; }
  }
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">MyNews</div>
    <button class="iconbtn" id="refresh" aria-label="Refresh">&#10227;</button>
    <button class="iconbtn" id="theme" aria-label="Switch theme">&#9789;</button>
  </div>
  <div class="datestamp" id="stamp">loading</div>
  <div class="views" id="views">
    <button data-v="news" class="on">News</button>
    <button data-v="markets">Markets</button>
  </div>
  <div id="newsctl">
    <div class="segwrap">
      <div class="seg" id="seg" role="tablist">
        <button data-r="india" role="tab">India</button>
        <button data-r="global" role="tab">Global</button>
        <button data-r="all" class="on" role="tab">All</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="mktctl" hidden>
    <div class="segwrap">
      <div class="seg" id="mseg" style="grid-template-columns:repeat(4,1fr)" role="tablist">
        <button data-m="india" class="on" role="tab">India</button>
        <button data-m="usa" role="tab">USA</button>
        <button data-m="china" role="tab">China</button>
        <button data-m="global" role="tab">Global</button>
      </div>
    </div>
  </div>
  <div class="rule"><hr></div>
</header>

<main id="feed"><div class="empty">Loading…</div></main>
<main id="mkt" hidden></main>

<div class="reader" id="reader" role="dialog" aria-modal="true">
  <div class="rbar"><div><button class="back" id="back">&#8592;&nbsp; Back</button></div></div>
  <article class="art" id="art"></article>
</div>

<script>
(function () {
  "use strict";

  var DATA = [], CATS = [], region = "all", cat = "All";

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function ago(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var h = (Date.now() - d.getTime()) / 36e5;
    if (h < 1) return Math.max(1, Math.round(h * 60)) + "m ago";
    if (h < 24) return Math.round(h) + "h ago";
    return Math.round(h / 24) + "d ago";
  }

  var TIER = {
    corroborated: { cls: "ok",    label: "Confirmed" },
    primary:      { cls: "ok",    label: "Primary source" },
    thin:         { cls: "warn",  label: "2 sources" },
    single:       { cls: "plain", label: "Single source" }
  };
  function badge(a) {
    var t = TIER[a.confidence] || TIER.single;
    var label = a.confidence === "corroborated" && a.publisher_count
      ? a.publisher_count + " sources" : t.label;
    return '<span class="badge ' + t.cls + '"><i></i>' + esc(label) + "</span>";
  }

  /* ---------- theme ---------- */
  try {
    var saved = localStorage.getItem("mynews-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  } catch (e) {}
  $("theme").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    if (!cur) cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("mynews-theme", next); } catch (e) {}
  });
  $("refresh").addEventListener("click", function () { location.reload(); });

  /* ---------- filtering ---------- */
  function visible() {
    return DATA.filter(function (a) {
      if (region !== "all" && a.region !== region) return false;
      if (cat !== "All" && a.category !== cat) return false;
      return true;
    });
  }

  function drawChips() {
    var pool = DATA.filter(function (a) { return region === "all" || a.region === region; });
    var order = ["Markets", "Economy & Policy", "Business", "Startups", "AI", "Innovation",
                 "Geopolitics", "India", "Aviation", "World", "Analysis"];
    var have = {};
    pool.forEach(function (a) { have[a.category] = 1; });
    CATS = order.filter(function (k) { return have[k]; });
    if (CATS.indexOf(cat) === -1) cat = "All";
    $("chips").innerHTML = ["All"].concat(CATS).map(function (k) {
      return '<button class="chip' + (k === cat ? " on" : "") + '" data-c="' + esc(k) + '">' + esc(k) + "</button>";
    }).join("");
    Array.prototype.forEach.call($("chips").querySelectorAll(".chip"), function (el) {
      el.addEventListener("click", function () {
        cat = el.getAttribute("data-c");
        drawChips(); draw();
      });
    });
  }

  function card(a, i, small) {
    return '<button class="story' + (small ? " small" : "") + '" data-i="' + i + '" ' +
      'style="animation-delay:' + Math.min(i * 45, 320) + 'ms">' +
      (a.image_url ? '<img class="shot" src="' + esc(a.image_url) + '" loading="lazy" alt="" ' +
        'onerror="this.style.display=\'none\'">' : "") +
      '<div class="eyebrow"><span class="cat">' + esc(a.category) + "</span>" + badge(a) + "</div>" +
      "<h2>" + esc(a.title) + "</h2>" +
      "<p>" + esc(a.summary) + "</p>" +
      '<div class="meta">' + esc(a.source) + " &middot; " + ago(a.published) +
      " &middot; " + (a.read_min || 3) + " min read</div></button>";
  }

  function draw() {
    var list = visible();
    var feed = $("feed");
    if (!list.length) {
      feed.innerHTML = '<div class="empty">Nothing here in this section.</div>';
      return;
    }
    var tops = list.filter(function (a) { return a.top_story; });
    var rest = list.filter(function (a) { return !a.top_story; });
    var html = "";
    if (tops.length) {
      html += '<div class="sect">Top stories</div>';
      tops.forEach(function (a) { html += card(a, DATA.indexOf(a), false); });
    }
    if (rest.length) {
      html += '<div class="sect">' + (cat === "All" ? "The rest" : esc(cat)) + "</div>";
      rest.forEach(function (a) { html += card(a, DATA.indexOf(a), true); });
    }
    feed.innerHTML = html;
    Array.prototype.forEach.call(feed.querySelectorAll("[data-i]"), function (el) {
      el.addEventListener("click", function () { open(+el.getAttribute("data-i")); });
    });
  }

  Array.prototype.forEach.call($("seg").querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () {
      region = b.getAttribute("data-r");
      Array.prototype.forEach.call($("seg").querySelectorAll("button"), function (x) {
        x.classList.toggle("on", x === b);
      });
      drawChips(); draw();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  /* ---------- reader ---------- */
  function bodyHtml(text) {
    return String(text || "").split(/\n\s*\n/).map(function (blk) {
      blk = blk.trim();
      if (!blk) return "";
      if (blk.indexOf("## ") === 0) return "<h2>" + esc(blk.slice(3)) + "</h2>";
      if (/^[-*] /.test(blk)) {
        return "<ul>" + blk.split(/\n/).map(function (li) {
          return "<li>" + fmt(li.replace(/^[-*] /, "")) + "</li>";
        }).join("") + "</ul>";
      }
      return "<p>" + fmt(blk) + "</p>";
    }).join("");
  }
  function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }

  function open(i) {
    var a = DATA[i];
    if (!a) return;
    var srcs = (a.sources || []).map(function (s) {
      return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
             esc(s.source) + " &#8599;</a></li>";
    }).join("");
    var disc = a.discussion ? '<div class="disc"><h4>What people are saying</h4>' +
      '<a href="' + esc(a.discussion.url) + '" target="_blank" rel="noopener">' +
      esc(a.discussion.title) + "</a>" +
      '<div class="st">' + esc(a.discussion.subreddit) + " &middot; " +
      esc(a.discussion.score) + " points &middot; " + esc(a.discussion.comments) +
      " comments</div></div>" : "";

    $("art").innerHTML =
      (a.image_url ? '<img class="lead" src="' + esc(a.image_url) + '" alt="" ' +
        'onerror="this.style.display=\'none\'">' : "") +
      '<div class="eyebrow" style="margin-top:20px"><span class="cat">' + esc(a.category) +
      "</span>" + badge(a) + "</div>" +
      "<h1>" + esc(a.title) + "</h1>" +
      '<div class="dek">' + esc(a.summary) + "</div>" +
      '<div class="byline"><b>' + esc(a.source) + "</b> &middot; " + ago(a.published) +
      " &middot; " + (a.read_min || 3) + " min read &middot; " +
      esc(a.region === "india" ? "India" : "Global") + "</div>" +
      (srcs ? '<div class="verify"><h4>Verified across ' + (a.sources.length) +
        (a.sources.length === 1 ? " publisher" : " publishers") + "</h4><ul>" + srcs + "</ul></div>" : "") +
      '<div class="body">' + bodyHtml(a.body) + "</div>" +
      disc +
      '<a class="srcbtn" href="' + esc(a.url) + '" target="_blank" rel="noopener">Read the original &#8599;</a>' +
      '<div class="note">Written for this digest from reporting by the publishers listed above. ' +
      "The analysis and framing are our own, not theirs. Confidence reflects how many independent " +
      "publishers carried the story &mdash; it is not a judgement of whether the reporting is right. " +
      "Nothing here is financial advice.</div>";

    $("reader").classList.add("open");
    $("reader").scrollTop = 0;
    document.body.style.overflow = "hidden";
    if (location.hash !== "#a" + i) location.hash = "#a" + i;
  }

  function close() {
    $("reader").classList.remove("open");
    document.body.style.overflow = "";
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  }
  $("back").addEventListener("click", function () {
    if (location.hash) history.back(); else close();
  });
  window.addEventListener("hashchange", function () {
    var m = /^#a(\d+)$/.exec(location.hash);
    if (m) open(+m[1]); else close();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && $("reader").classList.contains("open")) {
      if (location.hash) history.back(); else close();
    }
  });

  /* ---------- markets ---------- */
  var MKT = null, market = "india", mktStamp = "";

  function pct(v) {
    var s = (v > 0 ? "+" : "") + v.toFixed(2) + "%";
    return '<span class="' + (v >= 0 ? "up" : "dn") + '">' + s + "</span>";
  }
  function num(v) {
    return v >= 1000 ? v.toLocaleString("en-IN", { maximumFractionDigits: 2 }) : String(v);
  }

  function table(title, items, showSector) {
    if (!items || !items.length) return "";
    var rows = items.map(function (r) {
      var sub = showSector && r.sector ? r.sector : r.symbol;
      return '<div class="row"><div class="tick"><div class="sym">' + esc(r.name || r.symbol) +
        '</div><div class="sub">' + esc(sub) + "</div></div>" +
        '<div class="val"><div class="p">' + esc(num(r.price)) +
        '</div><div class="c">' + pct(r.change_pct) + "</div></div></div>";
    }).join("");
    return '<div class="tbl"><h4>' + esc(title) + "</h4>" + rows + "</div>";
  }

  function drawMarket() {
    if (!MKT) { $("mkt").innerHTML = '<div class="empty">Market data unavailable.</div>'; return; }
    var m = MKT.markets[market];
    if (!m) { $("mkt").innerHTML = '<div class="empty">No data for this market.</div>'; return; }

    var idx = (m.indices || []).map(function (i) {
      return '<div class="idx"><div class="nm">' + esc(i.symbol) + "</div>" +
        '<div class="px">' + esc(num(i.price)) + '</div>' +
        '<div class="ch">' + pct(i.change_pct) + "</div></div>";
    }).join("");

    var b = m.breadth || { up: 0, down: 0, total: 0 };
    var tot = Math.max(1, b.up + b.down);
    var ins = m.insight || { headline: "", body: "" };

    var read = '<div class="read"><h3>' + esc(ins.headline) + "</h3><p>" + esc(ins.body) + "</p>" +
      '<div class="breadth"><span>' + b.up + " up &middot; " + b.down + " down of " + b.total + "</span>" +
      '<span class="bar"><span class="g" style="width:' + (b.up / tot * 100) + '%"></span>' +
      '<span class="r" style="width:' + (b.down / tot * 100) + '%"></span></span></div></div>';

    var lead = (m.sectors && m.sectors.length)
      ? table("Sectors — best and worst",
          [m.sectors[0], m.sectors[m.sectors.length - 1]].map(function (s) {
            return { name: s.sector, symbol: s.n + (s.n === 1 ? " stock" : " stocks"),
                     price: "", change_pct: s.avg };
          }), false).replace(/<div class="p"><\/div>/g, "")
      : "";

    $("mkt").innerHTML =
      '<div class="idxstrip">' + idx + "</div>" + read + lead +
      table("Top gainers", m.gainers, true) +
      table("Top losers", m.losers, true) +
      table("Most active", m.actives, true) +
      table("Recent listings", m.recent, true) +
      '<div class="disclaim">Snapshot taken ' + esc(mktStamp) +
      ", not a live feed — the page is static, so prices refresh only when the digest is rebuilt. " +
      "India and China gainers and losers are computed from a large-cap universe, not the whole market. " +
      "US lists come from a market-wide screener. Data via Yahoo Finance. Not investment advice.</div>";
  }

  Array.prototype.forEach.call($("mseg").querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () {
      market = b.getAttribute("data-m");
      Array.prototype.forEach.call($("mseg").querySelectorAll("button"), function (x) {
        x.classList.toggle("on", x === b);
      });
      drawMarket();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  Array.prototype.forEach.call($("views").querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () {
      var v = b.getAttribute("data-v");
      Array.prototype.forEach.call($("views").querySelectorAll("button"), function (x) {
        x.classList.toggle("on", x === b);
      });
      var isNews = v === "news";
      $("newsctl").hidden = !isNews;
      $("mktctl").hidden = isNews;
      $("feed").hidden = !isNews;
      $("mkt").hidden = isNews;
      if (!isNews && !MKT) loadMarkets();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  function loadMarkets() {
    $("mkt").innerHTML = '<div class="empty">Loading market data…</div>';
    fetch("markets.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        MKT = d;
        var w = new Date(d.generated_at);
        mktStamp = isNaN(w) ? "" : w.toLocaleString("en-IN",
          { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
        drawMarket();
      })
      .catch(function (e) {
        $("mkt").innerHTML = '<div class="empty">Could not load market data.<br>' + esc(e.message) + "</div>";
      });
  }

  /* ---------- boot ---------- */
  fetch("articles.json?t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      DATA = d.articles || [];
      var when = new Date(d.generated_at);
      var stamp = isNaN(when) ? "" : when.toLocaleString("en-IN", {
        weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit"
      });
      var ind = DATA.filter(function (a) { return a.region === "india"; }).length;
      $("stamp").textContent = stamp + " · " + DATA.length + " stories · " +
                               ind + " India / " + (DATA.length - ind) + " global";
      drawChips(); draw();
      var m = /^#a(\d+)$/.exec(location.hash);
      if (m) open(+m[1]);
    })
    .catch(function (e) {
      $("feed").innerHTML = '<div class="empty">Could not load the feed.<br>' + esc(e.message) + "</div>";
    });
})();
</script>
</body>
</html>
