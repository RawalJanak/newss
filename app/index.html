<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyNews">
<title>MyNews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#faf9f7; --surface:#ffffff; --fg:#14171a; --muted:#5d646d; --faint:#8b929b;
    --border:#e4e1db; --chip:#efece7; --accent:#b3261e; --accent-fg:#ffffff;
    --shadow:0 1px 2px rgba(20,23,26,.05), 0 6px 18px rgba(20,23,26,.06);
    --font-serif:'Newsreader', Georgia, 'Times New Roman', serif;
    --font-sans:'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --maxw:720px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#101215; --surface:#181b1f; --fg:#e9eaec; --muted:#a2a9b2; --faint:#7b828b;
      --border:#282c32; --chip:#212529; --accent:#e8695f; --accent-fg:#101215;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#101215; --surface:#181b1f; --fg:#e9eaec; --muted:#a2a9b2; --faint:#7b828b;
    --border:#282c32; --chip:#212529; --accent:#e8695f; --accent-fg:#101215;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.4);
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--fg); font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;
  }
  a { color:inherit; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  img { display:block; max-width:100%; }

  /* ---------- header ---------- */
  header {
    position:sticky; top:0; z-index:60; background:var(--bg);
    border-bottom:1px solid var(--border);
    padding-top:env(safe-area-inset-top);
  }
  .masthead {
    max-width:var(--maxw); margin:0 auto; padding:12px 16px 10px;
    display:flex; align-items:center; gap:12px;
  }
  .brand {
    font-family:var(--font-serif); font-weight:700; font-size:26px;
    letter-spacing:-.02em; line-height:1; flex:1;
  }
  .brand span { color:var(--accent); }
  .iconbtn {
    width:38px; height:38px; border-radius:50%; background:var(--chip);
    display:grid; place-items:center; font-size:17px; flex:none;
  }
  .editionbar {
    max-width:var(--maxw); margin:0 auto; padding:0 16px 10px;
    font-size:11px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--faint); display:flex; gap:8px; align-items:center;
  }
  .dot { width:5px; height:5px; border-radius:50%; background:var(--accent); flex:none; }

  .chips {
    display:flex; gap:7px; overflow-x:auto; padding:2px 16px 11px;
    max-width:var(--maxw); margin:0 auto; scrollbar-width:none;
  }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:none; padding:7px 14px; border-radius:999px; background:var(--chip);
    font-size:13px; font-weight:500; color:var(--muted); white-space:nowrap;
    border:1px solid transparent;
  }
  .chip.active { background:var(--accent); color:var(--accent-fg); font-weight:700; }

  /* ---------- feed ---------- */
  main { max-width:var(--maxw); margin:0 auto; padding:18px 16px 72px; }
  .sectlabel {
    font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
    color:var(--faint); margin:26px 0 12px; display:flex; align-items:center; gap:9px;
  }
  .sectlabel::after { content:""; flex:1; height:1px; background:var(--border); }
  .sectlabel:first-child { margin-top:2px; }

  .hero {
    display:block; width:100%; text-align:left; background:var(--surface);
    border:1px solid var(--border); border-radius:12px; overflow:hidden;
    box-shadow:var(--shadow); margin-bottom:20px;
  }
  .hero img { width:100%; height:210px; object-fit:cover; background:var(--chip); }
  .hero .pad { padding:15px 16px 17px; }
  .hero h2 {
    font-family:var(--font-serif); font-size:25px; line-height:1.2; margin:8px 0 8px;
    font-weight:700; letter-spacing:-.015em;
  }
  .hero p { margin:0; font-size:15px; line-height:1.55; color:var(--muted); }

  .card {
    display:flex; gap:13px; width:100%; text-align:left; background:var(--surface);
    border:1px solid var(--border); border-radius:11px; padding:12px;
    margin-bottom:11px; box-shadow:var(--shadow); align-items:flex-start;
  }
  .card .txt { flex:1; min-width:0; }
  .card h3 {
    font-family:var(--font-serif); font-size:17px; line-height:1.28; margin:6px 0 6px;
    font-weight:600; letter-spacing:-.01em;
  }
  .card p {
    margin:0; font-size:13.5px; line-height:1.5; color:var(--muted);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card img {
    width:96px; height:96px; object-fit:cover; border-radius:8px;
    flex:none; background:var(--chip);
  }

  .kicker {
    font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent);
  }
  .meta { font-size:11.5px; color:var(--faint); margin-top:8px; }

  /* ---------- reader ---------- */
  .reader {
    position:fixed; inset:0; z-index:100; background:var(--bg);
    overflow-y:auto; -webkit-overflow-scrolling:touch; display:none;
  }
  .reader.open { display:block; }
  .readerbar {
    position:sticky; top:0; z-index:10; background:var(--bg);
    border-bottom:1px solid var(--border); padding-top:env(safe-area-inset-top);
  }
  .readerbar .inner {
    max-width:var(--maxw); margin:0 auto; padding:10px 14px;
    display:flex; align-items:center; gap:10px;
  }
  .backbtn { display:flex; align-items:center; gap:7px; font-size:15px; font-weight:500; }
  .article { max-width:var(--maxw); margin:0 auto; padding:0 16px 90px; }
  .article > img.lead {
    width:calc(100% + 32px); margin-left:-16px; height:250px; object-fit:cover;
    background:var(--chip);
  }
  .article h1 {
    font-family:var(--font-serif); font-size:31px; line-height:1.16; font-weight:700;
    margin:16px 0 12px; letter-spacing:-.02em;
  }
  .dek {
    font-family:var(--font-serif); font-size:18.5px; line-height:1.48; color:var(--muted);
    margin:0 0 16px; font-weight:400;
  }
  .byline {
    display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-size:12.5px;
    color:var(--faint); padding:11px 0; border-top:1px solid var(--border);
    border-bottom:1px solid var(--border); margin-bottom:22px;
  }
  .byline b { color:var(--fg); font-weight:600; }
  .body p { font-size:17px; line-height:1.72; margin:0 0 19px; }
  .body h2 {
    font-family:var(--font-serif); font-size:21px; line-height:1.3; font-weight:700;
    margin:30px 0 12px; letter-spacing:-.01em;
  }
  .body p:first-of-type::first-letter {
    font-family:var(--font-serif); font-size:52px; line-height:.85; float:left;
    padding:4px 9px 0 0; font-weight:700; color:var(--accent);
  }
  .srclink {
    display:inline-flex; align-items:center; gap:8px; margin-top:10px; padding:13px 18px;
    background:var(--accent); color:var(--accent-fg); border-radius:9px;
    font-weight:700; font-size:14.5px; text-decoration:none;
  }
  .disclaimer {
    margin-top:26px; padding:13px 15px; background:var(--chip); border-radius:9px;
    font-size:12.5px; line-height:1.6; color:var(--muted);
  }
  .empty { text-align:center; color:var(--faint); padding:60px 20px; font-size:15px; }

  @media (min-width:700px) {
    .hero img { height:300px; }
    .article > img.lead { height:340px; border-radius:12px; width:100%; margin-left:0; }
    .article h1 { font-size:38px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <div class="brand">My<span>News</span></div>
    <button class="iconbtn" id="refresh" aria-label="Refresh">&#10227;</button>
    <button class="iconbtn" id="theme" aria-label="Toggle theme">&#9789;</button>
  </div>
  <div class="editionbar"><span class="dot"></span><span id="edition">loading…</span></div>
  <div class="chips" id="chips"></div>
</header>

<main id="feed"><div class="empty">Loading…</div></main>

<div class="reader" id="reader">
  <div class="readerbar">
    <div class="inner">
      <button class="backbtn" id="back">&#8592; Back</button>
    </div>
  </div>
  <div class="article" id="article"></div>
</div>

<script>
(function () {
  "use strict";

  var DATA = [], CATS = [], active = "All";

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  function ago(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var h = (Date.now() - d.getTime()) / 36e5;
    if (h < 1) return Math.max(1, Math.round(h * 60)) + "m ago";
    if (h < 24) return Math.round(h) + "h ago";
    return Math.round(h / 24) + "d ago";
  }

  /* ---------- theme ---------- */
  var saved = null;
  try { saved = localStorage.getItem("mynews-theme"); } catch (e) {}
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  $("theme").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    if (!cur) {
      cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("mynews-theme", next); } catch (e) {}
  });

  $("refresh").addEventListener("click", function () { location.reload(); });

  /* ---------- images ---------- */
  function imgTag(src, cls) {
    if (!src) return "";
    return '<img class="' + cls + '" src="' + esc(src) + '" loading="lazy" alt="" ' +
           'onerror="this.style.display=\'none\'">';
  }

  /* ---------- feed ---------- */
  function render() {
    var list = active === "All" ? DATA : DATA.filter(function (a) { return a.category === active; });
    var feed = $("feed");
    if (!list.length) { feed.innerHTML = '<div class="empty">Nothing in this section yet.</div>'; return; }

    var tops = list.filter(function (a) { return a.top_story; });
    var rest = list.filter(function (a) { return !a.top_story; });
    var html = "";

    if (tops.length) {
      html += '<div class="sectlabel">Top stories</div>';
      tops.forEach(function (a) {
        var i = DATA.indexOf(a);
        html += '<button class="hero" data-i="' + i + '">' +
          imgTag(a.image_url, "") +
          '<div class="pad"><div class="kicker">' + esc(a.category) + '</div>' +
          '<h2>' + esc(a.title) + '</h2><p>' + esc(a.summary) + '</p>' +
          '<div class="meta">' + esc(a.source) + ' &middot; ' + ago(a.published) +
          ' &middot; ' + (a.read_min || 3) + ' min read</div></div></button>';
      });
    }
    if (rest.length) {
      html += '<div class="sectlabel">' + (active === "All" ? "More news" : esc(active)) + '</div>';
      rest.forEach(function (a) {
        var i = DATA.indexOf(a);
        html += '<button class="card" data-i="' + i + '">' +
          '<div class="txt"><div class="kicker">' + esc(a.category) + '</div>' +
          '<h3>' + esc(a.title) + '</h3><p>' + esc(a.summary) + '</p>' +
          '<div class="meta">' + esc(a.source) + ' &middot; ' + ago(a.published) +
          ' &middot; ' + (a.read_min || 3) + ' min</div></div>' +
          imgTag(a.image_url, "") + '</button>';
      });
    }
    feed.innerHTML = html;

    Array.prototype.forEach.call(feed.querySelectorAll("[data-i]"), function (el) {
      el.addEventListener("click", function () { open(+el.getAttribute("data-i")); });
    });
  }

  function chips() {
    var c = $("chips");
    c.innerHTML = ["All"].concat(CATS).map(function (k) {
      return '<button class="chip' + (k === active ? " active" : "") + '" data-c="' + esc(k) + '">' + esc(k) + "</button>";
    }).join("");
    Array.prototype.forEach.call(c.querySelectorAll(".chip"), function (el) {
      el.addEventListener("click", function () {
        active = el.getAttribute("data-c");
        chips(); render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  /* ---------- reader ---------- */
  function bodyHtml(text) {
    return String(text || "").split(/\n\s*\n/).map(function (block) {
      block = block.trim();
      if (!block) return "";
      if (block.indexOf("## ") === 0) return "<h2>" + esc(block.slice(3)) + "</h2>";
      return "<p>" + esc(block).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>") + "</p>";
    }).join("");
  }

  function open(i) {
    var a = DATA[i];
    if (!a) return;
    $("article").innerHTML =
      imgTag(a.image_url, "lead") +
      '<div class="kicker" style="margin-top:16px">' + esc(a.category) + "</div>" +
      "<h1>" + esc(a.title) + "</h1>" +
      '<div class="dek">' + esc(a.summary) + "</div>" +
      '<div class="byline"><b>' + esc(a.source) + "</b> &middot; " + ago(a.published) +
      " &middot; " + (a.read_min || 3) + " min read</div>" +
      '<div class="body">' + bodyHtml(a.body) + "</div>" +
      '<a class="srclink" href="' + esc(a.url) + '" target="_blank" rel="noopener">Read the original &#8599;</a>' +
      '<div class="disclaimer">Written for this digest from reporting by ' + esc(a.source) +
      " and other sources. Analysis and framing are our own, not the publisher's. " +
      "Follow the link above for the original article. Nothing here is financial advice.</div>";
    $("reader").classList.add("open");
    $("reader").scrollTop = 0;
    document.body.style.overflow = "hidden";
    if (location.hash !== "#a" + i) location.hash = "#a" + i;
  }

  function close() {
    $("reader").classList.remove("open");
    document.body.style.overflow = "";
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  }

  $("back").addEventListener("click", function () {
    if (location.hash) history.back(); else close();
  });
  window.addEventListener("hashchange", function () {
    var m = /^#a(\d+)$/.exec(location.hash);
    if (m) open(+m[1]); else close();
  });

  /* ---------- boot ---------- */
  fetch("articles.json?t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      DATA = d.articles || [];
      var order = ["Markets", "Economy & Policy", "Business", "Startups", "AI",
                   "Innovation", "Geopolitics", "India", "Aviation", "World"];
      var present = {};
      DATA.forEach(function (a) { present[a.category] = 1; });
      CATS = order.filter(function (k) { return present[k]; });
      Object.keys(present).forEach(function (k) {
        if (order.indexOf(k) === -1) CATS.push(k);
      });

      var when = new Date(d.generated_at);
      var stamp = isNaN(when) ? "" : when.toLocaleString("en-IN", {
        day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
      });
      $("edition").textContent = (d.edition || "") + " edition · " + stamp +
                                 " · " + DATA.length + " stories";
      chips(); render();

      var m = /^#a(\d+)$/.exec(location.hash);
      if (m) open(+m[1]);
    })
    .catch(function (e) {
      $("feed").innerHTML = '<div class="empty">Could not load the feed.<br>' + esc(e.message) + "</div>";
    });
})();
</script>
</body>
</html>
